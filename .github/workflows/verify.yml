name: Verify B4-1

on:
  push:
    branches:
      - mission/b4-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Static acceptance checks
        shell: bash
        run: |
          set +e
          python3 tests/static_check.py > /tmp/static-check.txt 2>&1
          STATUS=$?
          cat /tmp/static-check.txt
          if [ "$STATUS" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/static-check.txt
            exit "$STATUS"
          fi

      - name: Verify static site serves over HTTP
        run: |
          python3 -m http.server 8000 > /tmp/b4-1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /tmp/b4-1-index.html
          grep -q 'id="projects"' /tmp/b4-1-index.html
